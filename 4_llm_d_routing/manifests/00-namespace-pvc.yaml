apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-serving
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: llm-d-serving
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_HF_TOKEN"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: llm-d-serving
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 100Gi
