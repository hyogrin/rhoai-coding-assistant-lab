apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sequential-thinking
  namespace: mcp-servers
  labels:
    app: mcp-sequential-thinking
    app.kubernetes.io/part-of: code-assistant-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sequential-thinking
  template:
    metadata:
      labels:
        app: mcp-sequential-thinking
    spec:
      containers:
        - name: sequential-thinking
          image: node:20-slim
          command: ["sh", "-c"]
          args:
            - |
              npx -y supergateway \
                --stdio 'npx -y @modelcontextprotocol/server-sequential-thinking' \
                --port 3001 \
                --name sequential-thinking
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          ports:
            - containerPort: 3001
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sequential-thinking
  namespace: mcp-servers
  labels:
    app: mcp-sequential-thinking
spec:
  selector:
    app: mcp-sequential-thinking
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-sequential-thinking
  namespace: mcp-servers
spec:
  to:
    kind: Service
    name: mcp-sequential-thinking
  port:
    targetPort: 3001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
