apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-playwright
  namespace: mcp-servers
  labels:
    app: mcp-playwright
    app.kubernetes.io/part-of: code-assistant-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-playwright
  template:
    metadata:
      labels:
        app: mcp-playwright
    spec:
      containers:
        - name: playwright
          image: mcr.microsoft.com/playwright:v1.52.0-noble
          command: ["sh", "-c"]
          args:
            - |
              npx -y supergateway \
                --stdio 'npx -y @playwright/mcp@latest --headless' \
                --outputTransport streamableHttp \
                --port 3004 \
                --healthEndpoint /health \
                --name playwright
          ports:
            - containerPort: 3004
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: PLAYWRIGHT_CHROMIUM_SANDBOX
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-playwright
  namespace: mcp-servers
  labels:
    app: mcp-playwright
spec:
  selector:
    app: mcp-playwright
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-playwright
  namespace: mcp-servers
spec:
  to:
    kind: Service
    name: mcp-playwright
  port:
    targetPort: 3004
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
