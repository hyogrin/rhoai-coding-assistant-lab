apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-duckduckgo
  namespace: mcp-servers
  labels:
    app: mcp-duckduckgo
    app.kubernetes.io/part-of: code-assistant-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-duckduckgo
  template:
    metadata:
      labels:
        app: mcp-duckduckgo
    spec:
      containers:
        - name: duckduckgo
          image: node:20-slim
          command: ["sh", "-c"]
          args:
            - |
              npx -y supergateway \
                --stdio 'npx -y duckduckgo-mcp-server@latest' \
                --outputTransport streamableHttp \
                --port 3002 \
                --healthEndpoint /health \
                --name duckduckgo
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          ports:
            - containerPort: 3002
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-duckduckgo
  namespace: mcp-servers
  labels:
    app: mcp-duckduckgo
spec:
  selector:
    app: mcp-duckduckgo
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-duckduckgo
  namespace: mcp-servers
spec:
  to:
    kind: Service
    name: mcp-duckduckgo
  port:
    targetPort: 3002
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
