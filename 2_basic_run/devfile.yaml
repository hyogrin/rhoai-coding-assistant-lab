schemaVersion: 2.2.2
metadata:
  name: coding-assistant-lab
  displayName: "RHOAI Coding Assistant Lab"
  description: >
    AI coding workspace with OpenCode pre-installed.
    Model endpoint and API key are configured via environment variables.
    Includes VS Code extensions and browser-based Web UI (port 4096).
  icon: https://opencode.ai/favicon.ico
  tags:
    - AI
    - OpenCode
    - RHOAI
  version: 1.0.0
projects:
  - name: rhoai-coding-assistant-lab
    git:
      remotes:
        origin: https://github.com/hyogrin/rhoai-coding-assistant-lab.git
components:
  - name: dev-tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/opencode-build/devspaces-opencode:latest
      memoryRequest: 1Gi
      memoryLimit: 8Gi
      cpuRequest: 500m
      cpuLimit: 4000m
      mountSources: true
      sourceMapping: /projects
      env:
        # -- Replace these with your MaaS endpoint and API key --
        - name: OPENAI_BASE_URL
          value: "https://maas-api.CLUSTER_DOMAIN/NAMESPACE/MODEL_NAME/v1"
        - name: OPENAI_API_KEY
          value: "EMPTY"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: DEFAULT_EXTENSIONS
          value: "/tmp/opencode-ext/sst-dev.opencode-v2.vsix,/tmp/opencode-ext/sst-dev.opencode.vsix"
      endpoints:
        - name: opencode-web
          targetPort: 4096
          exposure: public
          protocol: https
          attributes:
            cookiesAuthEnabled: true
commands:
  - id: opencode
    exec:
      label: "Start OpenCode (TUI)"
      component: dev-tools
      workingDir: /projects
      commandLine: opencode
      group:
        kind: run
        isDefault: true
  - id: download-opencode-extension
    exec:
      label: "Download OpenCode Extension"
      component: dev-tools
      commandLine: |
        mkdir -p /tmp/opencode-ext
        curl -fsSL "https://open-vsx.org/api/sst-dev/opencode-v2/0.1.1/file/sst-dev.opencode-v2-0.1.1.vsix" \
          --location -o /tmp/opencode-ext/sst-dev.opencode-v2.vsix
        curl -fsSL "https://open-vsx.org/api/sst-dev/opencode/0.0.13/file/sst-dev.opencode-0.0.13.vsix" \
          --location -o /tmp/opencode-ext/sst-dev.opencode.vsix
        echo "OpenCode extensions downloaded (v2 Beta + classic)"
  - id: start-opencode-web
    exec:
      label: "Start OpenCode Web UI"
      component: dev-tools
      commandLine: |
        nohup opencode web --port 4096 --hostname 0.0.0.0 > /tmp/opencode-web.log 2>&1 &
        echo "OpenCode Web UI started on port 4096"
events:
  postStart:
    - download-opencode-extension
    - start-opencode-web
