apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cafe-api
  namespace: cafe-system
  labels:
    app: cafe-api
spec:
  selector:
    matchLabels:
      app: cafe-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - cafe-system
