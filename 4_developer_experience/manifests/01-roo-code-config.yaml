apiVersion: v1
kind: ConfigMap
metadata:
  name: roo-code-provider-config
  namespace: devspaces
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
  annotations:
    controller.devfile.io/mount-as: subpath
    controller.devfile.io/mount-path: /checode/remote/data/User/globalStorage/rooveterinaryinc.roo-cline/settings
data:
  provider_profiles.json: |
    {
      "currentApiConfigName": "maas-qwen3-coder",
      "apiConfigs": {
        "maas-qwen3-coder": {
          "id": "maas-qwen3-coder",
          "apiProvider": "openai",
          "openAiBaseUrl": "https://maas.CLUSTER_DOMAIN/v1",
          "openAiApiKey": "REPLACE_WITH_MAAS_API_KEY",
          "openAiModelId": "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
          "openAiStreamingEnabled": false
        }
      },
      "modeApiConfigs": {
        "code": "maas-qwen3-coder",
        "architect": "maas-qwen3-coder",
        "ask": "maas-qwen3-coder",
        "debug": "maas-qwen3-coder",
        "orchestrator": "maas-qwen3-coder"
      }
    }
