apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        isDefault: true
        jsonData:
          httpHeaderName1: Authorization
          tlsSkipVerify: true
        secureJsonData:
          httpHeaderValue1: "Bearer ${GRAFANA_SA_TOKEN}"
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo-lab.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: app
        folder: Application
        type: file
        options:
          path: /var/lib/grafana/dashboards/app
      - name: gpu
        folder: GPU
        type: file
        options:
          path: /var/lib/grafana/dashboards/gpu
      - name: llm
        folder: LLM
        type: file
        options:
          path: /var/lib/grafana/dashboards/llm
