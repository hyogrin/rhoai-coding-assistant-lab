apiVersion: v1
kind: Namespace
metadata:
  name: rhoai-models
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
    opendatahub.io/dashboard: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: rhoai-models
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_HF_TOKEN"
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: rhoai-models
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    openshift.io/display-name: vLLM ServingRuntime
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.16
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --trust-remote-code
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 16Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-fast
  namespace: rhoai-models
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: hf://ibm-granite/granite-3.3-2b-instruct
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: "1"
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-smart
  namespace: rhoai-models
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: hf://ibm-granite/granite-3.3-8b-instruct
    resources:
      requests:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "8"
        memory: 32Gi
        nvidia.com/gpu: "1"
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-code
  namespace: rhoai-models
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: hf://ibm-granite/granite-3.3-8b-instruct
      args:
        - --max-model-len=8192
    resources:
      requests:
        cpu: "4"
        memory: 24Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "8"
        memory: 32Gi
        nvidia.com/gpu: "1"
