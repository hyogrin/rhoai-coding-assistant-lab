apiVersion: v1
kind: Namespace
metadata:
  name: rhoai-models
  labels:
    app.kubernetes.io/part-of: code-assistant-lab
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "RHOAI Models - Code Assistant Lab"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: rhoai-models
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_HF_TOKEN"
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: rhoai-models
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "vLLM ServingRuntime (FP8)"
spec:
  annotations:
    openshift.io/display-name: vLLM ServingRuntime
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  multiModel: false
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.4.0
      command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --trust-remote-code
        - --max-model-len=16384
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 16Gi
