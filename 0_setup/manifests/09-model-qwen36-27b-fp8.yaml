apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen36-27b
  namespace: demo
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    kueue.x-k8s.io/queue-name: default
  annotations:
    openshift.io/display-name: "Qwen 3.6 27B FP8"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/storageSecretName: s3-model-connection
spec:
  model:
    name: qwen36-27b
    uri: s3://models/RedHatAI/Qwen3.6-27B-FP8
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len=4096 --gpu-memory-utilization=0.90 --enforce-eager --enable-auto-tool-choice --tool-call-parser=hermes"
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
